[project]
name = "workplace-monitoring-system"
version = "0.1.0"
description = "AI-Powered Workplace Monitoring System with Facial ReID"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "lapx>=0.5.5",
    "deepface>=0.0.84",
    "tf-keras>=2.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── PyTorch CUDA source ────────────────────────────────────────────────────────
# uv defaults to PyPI for torch, which ships a CPU-only wheel on Windows.
# Targeting cu128 to match torch 2.11.0+cu128 already cached from DSpro project
# — uv will hard-link from its shared cache, no download needed.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchvision = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
