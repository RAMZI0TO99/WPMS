[project]
name = "workplace-monitoring-system"
version = "0.1.0"
description = "AI-Powered Workplace Monitoring System with Facial ReID"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
